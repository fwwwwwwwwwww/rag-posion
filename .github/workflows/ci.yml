name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 用 lock 文件而不是 requirements.txt：后者是 `>=` 下界，
      # 会随上游发版漂移到未经验证的 langchain / langgraph 组合。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: 语法检查（编译所有 Python 源文件）
        run: |
          python -m compileall -q app agent attack eval tests \
            server.py RAGblack.py rag_graph.py vectordb.py

      - name: Lint（ruff）
        run: ruff check .

      # 只跑"离线可复现"的测试：不依赖 Ollama / Chroma / 33MB 知识库。
      # e2e_*.py、compare_defenses.py、run_campaign.py 等属于评测脚本，
      # 需要本机 Ollama + 已构建向量库，不能在 CI 里跑。
      - name: 单元测试
        run: |
          python tests/test_agent_smoke.py
          python tests/test_agent_api.py
          python tests/test_judge_fallback.py
          python tests/test_auth_api.py
